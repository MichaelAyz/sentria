# Fluent Bit Configuration Recipe for Sentria
# Forwards local log files directly to Sentria's /ingest/raw endpoint

[SERVICE]
    Flush        1
    Daemon       Off
    Log_Level    info

[INPUT]
    Name         tail
    Path         /var/log/syslog,/var/log/nginx/*.log,/var/log/app/*.log
    Tag          production.logs
    Refresh_Interval 2

[OUTPUT]
    Name         http
    Match        *
    Host         127.0.0.1
    Port         8000
    URI          /ingest/raw?source=fluentbit
    Format       raw
    Header       Content-Type text/plain
