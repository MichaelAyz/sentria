# Logstash Configuration Recipe for Sentria
# Forwards log file inputs directly to Sentria's /ingest/raw endpoint

input {
  file {
    path => [ "/var/log/syslog", "/var/log/**/*.log" ]
    start_position => "beginning"
  }
}

output {
  http {
    url => "http://127.0.0.1:8000/ingest/raw?source=logstash"
    http_method => "post"
    content_type => "text/plain"
    format => "message"
  }
}
